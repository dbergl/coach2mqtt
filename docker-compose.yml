name: coach2mqtt

services:
  rvc2mqtt:
    image: ghcr.io/dbergl/rvc2mqtt:latest
    labels:
      com.coach2mqtt.description: "RV-C to MQTT bridge"
      com.coach2mqtt.name: "RV-C"
    depends_on:
      - mosquitto
    environment:
      - CAN_INTERFACE_NAME=${RVC_CAN_INTERFACE_NAME:-can_rvc}
      - FLOORPLAN_FILE_1=/floorplan/${RVC_FLOORPLAN_FILE:-2021-2024_swift-ethos-launch-terrain.yml}
      - LOG_CONFIG_FILE=/config/${RVC_LOG_CONFIG_FILE}
      - MQTT_HOST=${MQTT_HOST:-localhost}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USERNAME
      - MQTT_PASSWORD
      - MQTT_CLIENT_ID
      - MQTT_TOPIC_BASE=${MQTT_TOPIC_BASE:-rvc}
      - TZ=America/Los_Angeles
    logging:
      driver: "local"
    network_mode: "host"
    restart: on-failure:10
    volumes:
      - ./configs/rvc2mqtt:/floorplan
      - ./configs/rvc2mqtt:/config:ro
      - ./rvc-logs:/logs

  can2mqtt:
    image: ghcr.io/dbergl/can2mqtt:latest
    labels:
      com.coach2mqtt.description: "Canbus to MQTT bridge"
      com.coach2mqtt.name: "Canbus"
    depends_on:
      - mosquitto
    environment:
      - CAN_INTERFACE_NAME=${CANBUS_CAN_INTERFACE_NAME:-can_bms}
      - CONFIG_FILE=/config/config.json
      - LOG_LEVEL=${CAN_LOG_LEVEL:-INFO}
      - MQTT_HOST=${MQTT_HOST:-localhost}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USERNAME
      - MQTT_PASSWORD
      - MQTT_CLIENT_ID
      - TZ=America/Los_Angeles
    logging:
      driver: "local"
    network_mode: "host"
    restart: on-failure:10
    volumes:
      - ./configs/can2mqtt/${CANBUS_CONFIG_FILE:-config.json}:/config/config.json:ro

  modbus2mqtt:
    image: ghcr.io/dbergl/modbus2mqtt:latest
    labels:
      com.coach2mqtt.description: "Modbus to MQTT bridge"
      com.coach2mqtt.name: "Modbus"
    command:
      - "python3"
      - "-u"
      - "modbus2mqtt.py"
      - "--add-to-homeassistant"
    depends_on:
      - mosquitto
    environment:
      - RTU=${RTU:-/dev/ttyUSB0}
      - CONFIG_FILE=/config/modbus2mqtt.csv
      - LOG_LEVEL=${MODBUS_LOG_LEVEL:-1}
      - MQTT_HOST=${MQTT_HOST:-mosquitto}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USERNAME
      - MQTT_PASSWORD
      - MQTT_CLIENT_ID
      - TZ=America/Los_Angeles
    logging:
      driver: "local"
    restart: on-failure:10
    device_cgroup_rules:
      - 'c 188:* rmw'
    volumes:
      - ./configs/modbus2mqtt/${MODBUS_CONFIG_FILE:-jayco.csv}:/config/modbus2mqtt.csv:ro
      - /run/udev:/run/udev:ro
      - /dev:/dev

  winegard2mqtt:
    build: ./winegard2mqtt
    labels:
      com.coach2mqtt.description: "Winegard ConnecT GPS/modem to MQTT bridge"
      com.coach2mqtt.name: "Winegard"
    depends_on:
      - mosquitto
    environment:
      - WINEGARD_HOST=${WINEGARD_HOST:-10.11.12.1}
      - WINEGARD_USERNAME=${WINEGARD_USERNAME:-admin}
      - WINEGARD_PASSWORD
      - WINEGARD_POLL_INTERVAL=${WINEGARD_POLL_INTERVAL:-60}
      - LOG_LEVEL=${WINEGARD_LOG_LEVEL:-INFO}
      - MQTT_HOST=${MQTT_HOST:-mosquitto}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USERNAME
      - MQTT_PASSWORD
      - MQTT_TOPIC_BASE=${WINEGARD_TOPIC_BASE:-winegard}
      - MQTT_CLIENT_ID=${WINEGARD_CLIENT_ID:-connect}
      - TZ=America/Los_Angeles
    logging:
      driver: "local"
    restart: on-failure:10

  node-red:
    image: nodered/node-red:latest
    labels:
      com.coach2mqtt.description: "Node-Red service for automation"
      com.coach2mqtt.name: "Node-Red"
    depends_on:
      - mosquitto
    environment:
      - TZ=America/Los_Angeles
    logging:
      driver: "local"
    ports:
      - "1880:1880"
    restart: on-failure:10
    volumes:
      - ./node-red-data:/data
      - ./configs/iotmqttpanel:/iotmqttpanel:ro

  mosquitto:
    image: eclipse-mosquitto:2
    labels:
      com.coach2mqtt.description: "MQTT Broker"
      com.coach2mqtt.name: "Mosquitto"
    restart: on-failure:10
    environment:
      TZ: America/Los_Angeles
    ports:
      - "1883:1883"
      - "9001:9001"
    logging:
      driver: "local"
    volumes:
      - ./logs/mosquitto:/mosquitto/log
      - ./mosquitto-data:/mosquitto/data
      - ./configs/mosquitto:/mosquitto/config:ro

  homeassistant:
    profiles: [ha]
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - ./configs/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
      TZ: America/Los_Angeles
      DISABLE_JEMALLOC: true

  influxdb:
    profiles: [influx]
    image: influxdb:2
    restart: on-failure:10
    ports:
      - "8086:8086"
    volumes:
      - ./influxdb-data:/var/lib/influxdb2
      - ./configs/influxdb:/etc/influxdb2

  telegraf:
    profiles: [influx]
    image: telegraf
    restart: on-failure:10
    depends_on:
      - influxdb
    environment:
      - INFLUX_TOKEN
    volumes:
      - ./configs/telegraf:/etc/telegraf
