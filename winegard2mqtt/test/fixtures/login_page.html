  <script type="text/javascript">
	function getCookie(name) {
		const regex = new RegExp(`(^| )${name}=([^;]+)`)
		const match = document.cookie.match(regex)
		if (match) {
			return match[2]
		}
	}

	function setCookie(cName, cValue) {
	        let date = new Date();
	        date.setTime(date.getTime() + (1 * 60 * 60 * 1000));
	        const expires = "expires=" + date.toUTCString();
	        document.cookie = cName + "=" + cValue + "; " + expires + "; path=/cgi-bin/luci/";
	}

	function redirOnExpire() {
		window.location='/cgi-bin/luci/themes/logout'
	}

	sysauth = getCookie('sysauth')
	sysauth2 = getCookie('sysauth2')

	if(sysauth != "" && sysauth !== undefined && sysauth != null) {
		setCookie('sysauth',sysauth)
		setTimeout(redirOnExpire, 3600000);
	}

	if(sysauth2 != "" && sysauth2 !== undefined && sysauth2 != null) {
		setCookie('sysauth2', sysauth2)
		setTimeout(redirOnExpire, 3600000);
	}
  </script>
