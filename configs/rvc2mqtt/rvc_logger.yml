#
# Logging info
# See https://docs.python.org/3/library/logging.config.html#logging-config-dictschema
#
logger:
  version: 1

  filters:
    # Injects source_id onto every RVC log record so the trace formatter can
    # reference %(source_id)s. Always passes the record through.
    rvc_source:
      (): rvc2mqtt.logging_support.RVCSourceFilter

    # Example gating filter — only let records from source 9C through.
    # Wire it into a handler's `filters:` list (after rvc_source) to capture
    # just that source. Source_id may also be a list, e.g. ["9C", "7A"].
    # rvc_only_9C:
    #   (): rvc2mqtt.logging_support.RVCSourceMatchFilter
    #   source_id: "9C"

  handlers:
    debug_console_handler:
      level: INFO
      class: logging.StreamHandler
      formatter: brief
      stream: ext://sys.stdout

    debug_file_handler:
      class : logging.handlers.RotatingFileHandler
      formatter: default
      maxBytes: 10485760   #10 mb
      backupCount: 1
      level: INFO
      filename: /logs/RVC2MQTT.log
      mode: w

    unhandled_file_handler:
      class : logging.handlers.RotatingFileHandler
      formatter: trace
      maxBytes: 10485760   #10 mb
      backupCount: 1
      level: DEBUG
      filename: /logs/UNHANDLED_RVC.log
      filters: [rvc_source]

    rvc_bus_trace_handler:
      class : logging.handlers.RotatingFileHandler
      formatter: trace
      filename: /logs/RVC_FULL_BUS_TRACE.log
      maxBytes: 10485760   #10 mb
      backupCount: 3
      level: DEBUG
      filters: [rvc_source]

    # Example per-source trace handler. Uncomment this and rvc_only_9C
    # above, then add `src_9C_trace_handler` to the rvc_bus_trace logger's
    # handlers list to capture just source 9C into its own file. The
    # all-bus-trace handler keeps receiving every record.
    # src_9C_trace_handler:
    #   class: logging.handlers.RotatingFileHandler
    #   formatter: trace
    #   filename: /logs/RVC_SRC_9C_TRACE.log
    #   maxBytes: 10485760
    #   backupCount: 3
    #   level: DEBUG
    #   filters: [rvc_source, rvc_only_9C]

  loggers:
    "": # root logger
      handlers:
        - debug_console_handler
        - debug_file_handler
      level: DEBUG
      propagate: False

    "unhandled_rvc": # unhandled messages
      handlers:
        - unhandled_file_handler
      level: DEBUG
      propagate: False

    "rvc_bus_trace": # all bus messages
      handlers:
        - rvc_bus_trace_handler
        # - src_9C_trace_handler
      level: DEBUG
      propagate: False

  formatters:
    brief:
      format: "%(message)s"
    default:
      format: "%(asctime)s %(levelname)-8s %(name)-15s %(message)s"
      datefmt: "%Y-%m-%d %H:%M:%S"
    trace:
      format: "%(asctime)s [src=%(source_id)s] %(message)s"
      datefmt: "%Y-%m-%d %H:%M:%S"
